# The suite's CI, called rather than restated.
#
# This was two jobs listing ruff, black, isort, mypy and pytest by hand.
# The crawler listed fourteen, the Source Directory eight, and no two of
# them ran the same stages in the same order -- so a rule learned in one
# repository stayed there, and a suite-wide fix meant three pull
# requests that were never quite the same.
#
# The stages, their order and the Postgres service come from
# lnic-contracts. What runs inside them is this repository's Makefile,
# which is also what a person runs here, so CI and a local run cannot
# mean different things.
#
# `conforms` is the part that keeps it true: it fails if this repository
# drifts back to defining its own stages, loses a make target the shared
# workflow calls, or drops the pre-push hook.
name: CI

on:
  # main only. An unscoped `push:` ran this whole workflow a second time
  # on every pull request push -- once for the branch and once for the
  # merge ref -- and `concurrency` does not collapse them, because their
  # refs differ (refs/heads/... against refs/pull/N/merge). PR #247 ran
  # lint, the Postgres service and 1,388 tests twice for one commit.
  #
  # A branch pushed without a pull request now gets no run here. The
  # pre-push hook already ran `make check` on it, and the pull request
  # runs it again; a third pass was never the thing keeping main green.
  push:
    branches: [main]
  pull_request:
  # Re-run without a commit: a shared-workflow change lands in
  # lnic-contracts, not here, so there may be nothing to push to test it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: LocalNewsImpact/lnic-contracts/.github/workflows/python-checks.yml@ci-v1
    with:
      # `make .venv` rather than `make setup`: setup also writes .env and
      # runs migrations, which need a database this stage does not have.
      install: make .venv
      # mypy runs inside `make lint` here, so there is no separate stage.
      typecheck: false
      # No integration suite in this repository yet. Declaring one that
      # does not exist would fail the conformance check, which is the
      # point of it.
      integration: false

  conforms:
    uses: LocalNewsImpact/lnic-contracts/.github/workflows/conforms.yml@ci-v1
    with:
      # The same two flags the checks job declares. Passed rather than
      # left to default: conforms uses them to decide which make targets
      # to require, so a repository that turns a stage on above and not
      # here would run a stage whose target nothing checks for.
      typecheck: false
      integration: false
