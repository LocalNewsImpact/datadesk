# Runs only on main, after CI has passed and a reviewer has approved — branch
# protection guarantees both, so this workflow does not re-check them.
#
# This workflow decides *whether* to deploy and resolves the versions; the
# building and the rollout are gcp/cloudbuild/cloudbuild-datadesk.yaml. That
# split is MizzouNewsCrawler's, adopted so all three repositories keep their
# deploy logic in one place and one shape.
#
# The rollout itself is unchanged and still NewsSourceDirectory's proven
# shape: dependency image keyed to a requirements hash, migrate before
# traffic, prove a no-traffic candidate revision, then shift.
#
# The Workload Identity provider path contains the GCP project number, which
# does not exist until infra/bootstrap.sh has run. It therefore lives in the
# WIF_PROVIDER repository variable — bootstrap prints the exact `gh variable
# set` command — and until the variable is set, this workflow skips instead
# of failing every push.

name: Deploy

# Documentation does not reach the running service: a Markdown-only merge
# would spend a full build and rollout to change nothing. A push that touches
# both docs and code still deploys — the filter skips the run only when every
# changed path is listed here.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'infra/**'
  workflow_dispatch:

concurrency:
  group: deploy-main          # never two deploys at once
  cancel-in-progress: false   # let a running deploy finish

permissions:
  contents: read
  id-token: write             # required to mint the WIF token

env:
  PROJECT_ID: lnic-datadesk
  # Where the build runs, which is not where the service runs -- Cloud Run,
  # Artifact Registry and Cloud SQL are all us-central1, and that region is
  # the build config's own _REGION substitution.
  #
  # The regional default pool in us-central1 stopped scheduling this
  # project's builds on 2026-08-28: a build failed with INTERNAL_ERROR, and
  # every build after it -- including a one-step probe asking for a single
  # CPU -- sat QUEUED past its own hour-long queueTtl. The same probe in
  # us-east1 finished in fifteen seconds. Only the machine doing the docker
  # build moves.
  BUILD_REGION: us-east1
  SERVICE: datadesk
  REPO: app
  # Cloud Run reaches Cloud SQL over a unix socket rather than a host and
  # port, so the service is given the connection name and assembles the DSN
  # itself (datadesk/settings.py). A DATABASE_URL built here would point the
  # deployed service at its own localhost.
  SQL_INSTANCE: mizzou-news-crawler:us-central1:mizzou-db-prod
  ADMIN_HOST: datadesk.localnewsimpact.org
  # The second front end this image serves, in its own project. See the block
  # at the end of the deploy job.
  SOURCES_PROJECT: lnic-source-directory
  SOURCES_HOST: sources.localnewsimpact.org

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Skip quietly until bootstrap has run and WIF_PROVIDER is set.
    if: vars.WIF_PROVIDER != ''
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: github-deploy@lnic-datadesk.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Confirm the deploy identity
        run: |
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          echo "project: ${PROJECT_ID}"

      # The newest released tag of the Source Directory, read from the API.
      # That package installs into this image; pinning it in requirements.txt
      # meant a pull request here every time it released, and the ruleset
      # requires somebody to approve one -- the manual step moved rather than
      # removed.
      #
      # Resolved here rather than in the build because Cloud Build has no
      # token for that repository. A tag, never a branch: releasing is a
      # version bump in that repository's own reviewed pull request, so an
      # unfinished main cannot walk into this image.
      - name: Resolve the Source Directory
        id: directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # sort -V, not sort: v0.10.0 has to beat v0.9.0.
          VERSION="$(gh api repos/LocalNewsImpact/NewsSourceDirectory/tags \
            --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::No release tag on NewsSourceDirectory"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "installing the Source Directory at $VERSION"

      # Building and rolling out both consoles is gcp/cloudbuild/, not steps
      # here -- the same split MizzouNewsCrawler uses, so all three
      # repositories keep their deploy logic in one shape and versions travel
      # as substitutions rather than as edits to a file.
      #
      # `builds submit` rather than a trigger: it uploads this checkout, so
      # the build is of exactly this commit with no repository connection to
      # configure. A trigger can be layered on later without changing the
      # config file.
      #
      # The build runs as github-deploy, the identity this workflow already
      # federates to, which holds run.developer and serviceAccountUser in both
      # projects. No second identity, and no cross-project grant to keep in
      # step with this one.
      - name: Build and deploy
        run: |
          gcloud builds submit \
            --config=gcp/cloudbuild/cloudbuild-datadesk.yaml \
            --project="$PROJECT_ID" \
            --region="$BUILD_REGION" \
            --service-account="projects/$PROJECT_ID/serviceAccounts/github-deploy@$PROJECT_ID.iam.gserviceaccount.com" \
            --substitutions="_SHORT_SHA=${GITHUB_SHA::7},_DIRECTORY_VERSION=${{ steps.directory.outputs.version }}"
