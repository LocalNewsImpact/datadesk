# The database the test suite runs against.
#
# Production is Postgres and the suite used to be sqlite, which accepts
# SQL Postgres refuses — a `?|` operator on a text column and DISTINCT
# over a `json` column both shipped green. Tests now run here.
#
# Port 5435 is deliberate. 5432 is the crawler's database, 5433 its
# scratch instance and 5434 the Source Directory's; this one was 5434 too,
# and the suite ran against the directory's database, with an
# authentication error as the only symptom. Another container on the port
# fails loudly at `up`; a host process on it does not -- Docker Desktop
# starts the container, reports the binding, and the process keeps
# answering -- which is why `make test-db` checks who answers. The suite's
# port table is in lnic-contracts docs/shared-ci.md.
#
#   make test          starts this, waits for it, runs the suite
#   make test-db-down  stops it
services:
  postgres:
    image: postgres:16
    container_name: datadesk-test-postgres
    environment:
      POSTGRES_USER: datadesk
      POSTGRES_PASSWORD: datadesk
      POSTGRES_DB: datadesk
    ports:
      - "5435:5432"
    # No volume. The suite creates and drops its own test databases, and
    # nothing here is worth keeping between runs.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datadesk"]
      interval: 2s
      timeout: 3s
      retries: 30
