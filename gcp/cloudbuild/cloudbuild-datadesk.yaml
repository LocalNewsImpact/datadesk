# Build and deploy Datadesk, and the Source Directory console it shares an
# image with.
#
# Fired by .github/workflows/deploy.yml on a merge to main; runnable by hand
# from a checkout with:
#
#   gcloud builds submit --config=gcp/cloudbuild/cloudbuild-datadesk.yaml \
#     --substitutions=_DIRECTORY_VERSION=v0.2.0
#
# The same split MizzouNewsCrawler uses: GitHub Actions decides *whether* to
# build and supplies the versions; Cloud Build does the building and the
# rollout. Versions live here as substitutions, so pinning one is a flag on
# the invocation rather than an edit to a file that needs a pull request.
#
# _DIRECTORY_VERSION has no default on purpose. NewsSourceDirectory's tags
# are not readable without a token, and Cloud Build has none -- Actions
# resolves the newest release tag and passes it in. A build with it unset
# fails at the first step rather than quietly installing nothing.

substitutions:
  _REGION: us-central1
  _REGISTRY: us-central1-docker.pkg.dev/lnic-datadesk/app
  _SERVICE: datadesk
  _RUN_SA: datadesk-run@lnic-datadesk.iam.gserviceaccount.com
  _SQL_INSTANCE: mizzou-news-crawler:us-central1:mizzou-db-prod
  _ADMIN_HOST: datadesk.localnewsimpact.org
  # The second front end this image serves, in its own project.
  _SOURCES_PROJECT: lnic-source-directory
  _SOURCES_HOST: sources.localnewsimpact.org
  _SOURCES_SA: directory-run@lnic-source-directory.iam.gserviceaccount.com
  # The public data front end (ROADMAP item 24). Same image, SERVICE_ROLE=data,
  # its own service so the console is absent from a hostname readers link to.
  _DATA_HOST: data.localnewsimpact.org
  _DIRECTORY_VERSION: ''
  # Set by the caller. SHORT_SHA is a trigger-only builtin and is empty
  # under `builds submit`, so the commit travels as its own substitution.
  _SHORT_SHA: ''

steps:
  # --- images ---------------------------------------------------------------

  # The dependency image is rebuilt only when its inputs change. Tagging it
  # with a hash of requirements.txt *and* the resolved directory version makes
  # "has anything changed?" a registry lookup rather than a guess. The version
  # has to be in the key: without it a new release would not change
  # requirements.txt, the base image would be reused, and the new code would
  # never reach the image -- the failure that is easiest to miss, because
  # every step still reports success.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'base'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ -z "${_SHORT_SHA}" ]; then
          echo "_SHORT_SHA is unset; the image would be tagged with nothing."
          exit 1
        fi
        if [ -z "${_DIRECTORY_VERSION}" ]; then
          echo "_DIRECTORY_VERSION is unset. Actions resolves it; pass it with"
          echo "  --substitutions=_DIRECTORY_VERSION=vX.Y.Z"
          exit 1
        fi
        HASH="$$(cat requirements.txt <(echo "${_DIRECTORY_VERSION}") \
          | sha256sum | cut -c1-12)"
        BASE="${_REGISTRY}/${_SERVICE}-base:$$HASH"
        echo "$$BASE" > /workspace/base-image

        # `docker manifest inspect`, not `gcloud artifacts describe`: this
        # step runs in gcr.io/cloud-builders/docker, which has no gcloud.
        # The gcloud call therefore failed on every build, took the else
        # branch, and rebuilt an image that was already in the registry --
        # invisibly, because the failure went to /dev/null with the output.
        if docker manifest inspect "$$BASE" >/dev/null 2>&1; then
          echo "reusing $$HASH -- dependencies unchanged"
        else
          echo "building $$HASH -- requirements.txt or the directory version changed"
          docker build -f Dockerfile.base \
            --build-arg "DIRECTORY_VERSION=${_DIRECTORY_VERSION}" \
            -t "$$BASE" .
          docker push "$$BASE"
        fi

  - name: 'gcr.io/cloud-builders/docker'
    id: 'app'
    entrypoint: 'bash'
    waitFor: ['base']
    args:
      - '-c'
      - |
        set -euo pipefail
        BASE="$$(cat /workspace/base-image)"
        IMAGE="${_REGISTRY}/${_SERVICE}:${_SHORT_SHA}"
        docker build --build-arg "BASE_IMAGE=$$BASE" -t "$$IMAGE" .
        docker push "$$IMAGE"

  # --- Datadesk -------------------------------------------------------------

  # Migrations run before traffic shifts, never as a side effect of the
  # service starting -- two revisions racing to migrate is a bad night.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'migrate'
    entrypoint: 'bash'
    waitFor: ['app']
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="${_REGISTRY}/${_SERVICE}:${_SHORT_SHA}"
        gcloud run jobs deploy "${_SERVICE}-release" \
          --image "$$IMAGE" --region "${_REGION}" --project "$PROJECT_ID" \
          --command /bin/sh \
          --args "^|^-c|python manage.py migrate --noinput && python manage.py createcachetable && python manage.py configure_site --domain ${_ADMIN_HOST}" \
          --set-secrets DJANGO_SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest \
          --set-env-vars "CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE},DB_NAME=datadesk,DB_USER=datadesk" \
          --set-cloudsql-instances "${_SQL_INSTANCE}" \
          --service-account "${_RUN_SA}"
        gcloud run jobs execute "${_SERVICE}-release" \
          --region "${_REGION}" --project "$PROJECT_ID" --wait

  # There is no staging environment. Instead the revision is deployed with no
  # traffic and proved on its own tagged URL first, so a broken build never
  # serves a request: if the check below fails, traffic stays put.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'candidate'
    entrypoint: 'bash'
    waitFor: ['migrate']
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="${_REGISTRY}/${_SERVICE}:${_SHORT_SHA}"
        # Cloud Run refuses --no-traffic when creating a service, so a first
        # deploy takes traffic directly and the smoke test is its gate.
        if gcloud run services describe "${_SERVICE}" --region "${_REGION}" \
            --project "$PROJECT_ID" >/dev/null 2>&1; then
          TRAFFIC_FLAGS="--no-traffic --tag=candidate"
        else
          echo "first deploy: service does not exist; deploying with traffic"
          TRAFFIC_FLAGS=""
        fi
        gcloud run deploy "${_SERVICE}" \
          $$TRAFFIC_FLAGS \
          --image "$$IMAGE" --region "${_REGION}" --project "$PROJECT_ID" \
          --service-account "${_RUN_SA}" \
          --set-secrets "DJANGO_SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest,CRAWLER_DB_PASSWORD=crawler-ro-password:latest,CRAWLER_RW_DB_PASSWORD=crawler-rw-password:latest,GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest" \
          --set-env-vars "^@^CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE}@DB_NAME=datadesk@DB_USER=datadesk@CRAWLER_DB_NAME=mizzou@CRAWLER_DB_USER=datadesk_ro@CRAWLER_RW_DB_USER=datadesk_rw@ALLOWED_AUTH_DOMAINS=localnewsimpact.org@DJANGO_ALLOWED_HOSTS=${_ADMIN_HOST},.run.app@DJANGO_CSRF_TRUSTED_ORIGINS=https://${_ADMIN_HOST}@SESSION_COOKIE_DOMAIN=.localnewsimpact.org" \
          --set-cloudsql-instances "${_SQL_INSTANCE}" \
          --ingress all --allow-unauthenticated --min-instances 0

  # gcloud reports a failed IAM binding as a warning and still exits zero, so
  # a deploy can report success while leaving the service unreachable. That is
  # what the directory's first real deploy did: Domain Restricted Sharing
  # refused the public invoker binding and every request got a 403 before
  # reaching Django. Check, don't hope.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'reachable'
    entrypoint: 'bash'
    waitFor: ['candidate']
    args:
      - '-c'
      - |
        set -euo pipefail
        policy="$$(gcloud run services get-iam-policy "${_SERVICE}" \
                   --region "${_REGION}" --project "$PROJECT_ID" --format=json)"
        if ! echo "$$policy" | grep -q 'run.invoker'; then
          echo "No invoker binding -- deployed but nobody can reach it."
          echo "Domain Restricted Sharing blocks this unless the project has an exception."
          echo "See infra/README.md, 'Public ingress'."
          exit 1
        fi
        echo "invoker binding present"

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'prove'
    entrypoint: 'bash'
    waitFor: ['reachable']
    args:
      - '-c'
      - |
        set -euo pipefail
        URL="$$(gcloud run services describe "${_SERVICE}" --region "${_REGION}" \
                --project "$PROJECT_ID" --format=json \
                | python3 -c 'import json,sys; print(next((t["url"] for t in json.load(sys.stdin)["status"]["traffic"] if t.get("tag")=="candidate"), ""))')"
        if [ -z "$$URL" ]; then
          URL="$$(gcloud run services describe "${_SERVICE}" --region "${_REGION}" \
                  --project "$PROJECT_ID" --format='value(status.url)')"
        fi
        [ -n "$$URL" ] || { echo "no URL to check"; exit 1; }
        code=""
        for _ in $$(seq 1 10); do
          code="$$(curl -s -o /dev/null -w '%{http_code}' "$$URL/_health" || true)"
          [ "$$code" = "200" ] && break
          sleep 3
        done
        echo "candidate $$URL/_health -> $$code"
        [ "$$code" = "200" ] || { echo "candidate failed its health check; traffic not shifted"; exit 1; }

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'shift'
    entrypoint: 'bash'
    waitFor: ['prove']
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run services update-traffic "${_SERVICE}" \
          --region "${_REGION}" --project "$PROJECT_ID" --to-latest
        URL="$$(gcloud run services describe "${_SERVICE}" --region "${_REGION}" \
                --project "$PROJECT_ID" --format='value(status.url)')"
        code="$$(curl -s -o /dev/null -w '%{http_code}' "$$URL/_health")"
        echo "$$URL/_health -> $$code"
        [ "$$code" = "200" ] || { echo "smoke test failed after traffic shift"; exit 1; }

  # Warming is its own job because it needs the crawler database, which the
  # release job has no credentials for. Deployed with every release so the
  # image stays in step; Cloud Scheduler runs it on a schedule.
  #
  # After the shift, not before. Run earlier it primed the cache against the
  # revision being replaced, and blocked the rollout while doing it.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'warm-job'
    entrypoint: 'bash'
    waitFor: ['shift']
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="${_REGISTRY}/${_SERVICE}:${_SHORT_SHA}"
        gcloud run jobs deploy "${_SERVICE}-warm" \
          --image "$$IMAGE" --region "${_REGION}" --project "$PROJECT_ID" \
          --command /bin/sh \
          --args "^|^-c|python manage.py warm_caches --force" \
          --set-secrets "DJANGO_SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest,CRAWLER_DB_PASSWORD=crawler-ro-password:latest" \
          --set-env-vars "^@^CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE}@DB_NAME=datadesk@DB_USER=datadesk@CRAWLER_DB_NAME=mizzou@CRAWLER_DB_USER=datadesk_ro" \
          --set-cloudsql-instances "${_SQL_INSTANCE}" \
          --service-account "${_RUN_SA}"
        # Started, not waited on. Waiting held the rollout open for three
        # minutes for work no request depends on, and Cloud Scheduler runs
        # this job on its own besides. A failure surfaces there.
        gcloud run jobs execute "${_SERVICE}-warm" \
          --region "${_REGION}" --project "$PROJECT_ID"

  # --- The Source Directory front end ---------------------------------------
  #
  # One image, two front ends (ROADMAP item 14). Everything above serves
  # Datadesk; everything below serves the same image as sources-admin with
  # SERVICE_ROLE=sources, in a different project. It runs after Datadesk's own
  # rollout is proved, so a bad image is caught on one console before it
  # reaches the other.

  # `migrate directory`, not `migrate`. Both consoles share one ledger in
  # public.django_migrations, but this job runs with
  # search_path=directory,public, so an unqualified CREATE TABLE from some
  # *other* app's unapplied migration would put its table in the directory
  # schema. Naming the app is what makes that impossible.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'sources-migrate'
    entrypoint: 'bash'
    waitFor: ['shift']
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="${_REGISTRY}/${_SERVICE}:${_SHORT_SHA}"
        gcloud run jobs deploy sources-admin-release \
          --image "$$IMAGE" --region "${_REGION}" --project "${_SOURCES_PROJECT}" \
          --command /bin/sh \
          --args "^|^-c|python manage.py migrate directory --noinput && python manage.py configure_site --domain ${_SOURCES_HOST} && python manage.py check_data" \
          --set-secrets DJANGO_SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest \
          --set-env-vars "^@^SERVICE_ROLE=sources@CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE}@DB_NAME=datadesk@DB_USER=directory@DB_SEARCH_PATH=directory,public@SITE_ID=2" \
          --set-cloudsql-instances "${_SQL_INSTANCE}" \
          --service-account "${_SOURCES_SA}"
        gcloud run jobs execute sources-admin-release \
          --region "${_REGION}" --project "${_SOURCES_PROJECT}" --wait

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'sources-candidate'
    entrypoint: 'bash'
    waitFor: ['sources-migrate']
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="${_REGISTRY}/${_SERVICE}:${_SHORT_SHA}"
        gcloud run deploy sources-admin \
          --no-traffic --tag=candidate \
          --image "$$IMAGE" --region "${_REGION}" --project "${_SOURCES_PROJECT}" \
          --service-account "${_SOURCES_SA}" \
          --set-secrets "DJANGO_SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest,GOOGLE_OAUTH_CLIENT_ID=google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest" \
          --set-env-vars "^@^SERVICE_ROLE=sources@CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE}@DB_NAME=datadesk@DB_USER=directory@DB_SEARCH_PATH=directory,public@SITE_ID=2@ALLOWED_AUTH_DOMAINS=localnewsimpact.org@DJANGO_ALLOWED_HOSTS=${_SOURCES_HOST},.run.app@DJANGO_CSRF_TRUSTED_ORIGINS=https://${_SOURCES_HOST}@SESSION_COOKIE_DOMAIN=.localnewsimpact.org" \
          --set-cloudsql-instances "${_SQL_INSTANCE}" \
          --ingress all --allow-unauthenticated --min-instances 0

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'sources-reachable'
    entrypoint: 'bash'
    waitFor: ['sources-candidate']
    args:
      - '-c'
      - |
        set -euo pipefail
        policy="$$(gcloud run services get-iam-policy sources-admin \
                   --region "${_REGION}" --project "${_SOURCES_PROJECT}" --format=json)"
        if ! echo "$$policy" | grep -q 'run.invoker'; then
          echo "No invoker binding on sources-admin -- deployed but nobody can reach it."
          exit 1
        fi
        echo "invoker binding present"

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'sources-prove'
    entrypoint: 'bash'
    waitFor: ['sources-reachable']
    args:
      - '-c'
      - |
        set -euo pipefail
        URL="$$(gcloud run services describe sources-admin --region "${_REGION}" \
                --project "${_SOURCES_PROJECT}" --format=json \
                | python3 -c 'import json,sys; print(next((t["url"] for t in json.load(sys.stdin)["status"]["traffic"] if t.get("tag")=="candidate"), ""))')"
        [ -n "$$URL" ] || { echo "no candidate URL for sources-admin"; exit 1; }
        code=""
        for _ in $$(seq 1 10); do
          code="$$(curl -s -o /dev/null -w '%{http_code}' "$$URL/_health" || true)"
          [ "$$code" = "200" ] && break
          sleep 3
        done
        echo "candidate $$URL/_health -> $$code"
        [ "$$code" = "200" ] || { echo "sources-admin candidate failed its health check; traffic not shifted"; exit 1; }

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'sources-shift'
    entrypoint: 'bash'
    waitFor: ['sources-prove']
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run services update-traffic sources-admin \
          --region "${_REGION}" --project "${_SOURCES_PROJECT}" --to-latest
        URL="$$(gcloud run services describe sources-admin --region "${_REGION}" \
                --project "${_SOURCES_PROJECT}" --format='value(status.url)')"
        code="$$(curl -s -o /dev/null -w '%{http_code}' "$$URL/_health")"
        echo "$$URL/_health -> $$code"
        [ "$$code" = "200" ] || { echo "sources-admin smoke test failed after traffic shift"; exit 1; }

  # --- The public data front end -------------------------------------------
  #
  # Feeds, visual payloads and embeds, and nothing of the console. It runs
  # after Datadesk's own rollout is proved, like the directory does, so a
  # bad image is caught on one console before it reaches anything public.
  #
  # No migration: it owns no tables, and reads what the console has already
  # written.

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'data-candidate'
    entrypoint: 'bash'
    waitFor: ['shift']
    args:
      - '-c'
      - |
        set -euo pipefail
        IMAGE="${_REGISTRY}/${_SERVICE}:${_SHORT_SHA}"
        if gcloud run services describe datadesk-data --region "${_REGION}" \
            --project "$PROJECT_ID" >/dev/null 2>&1; then
          TRAFFIC_FLAGS="--no-traffic --tag=candidate"
        else
          echo "first deploy: service does not exist; deploying with traffic"
          TRAFFIC_FLAGS=""
        fi
        gcloud run deploy datadesk-data \
          $$TRAFFIC_FLAGS \
          --image "$$IMAGE" --region "${_REGION}" --project "$PROJECT_ID" \
          --service-account "${_RUN_SA}" \
          --set-secrets "DJANGO_SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest,CRAWLER_DB_PASSWORD=crawler-ro-password:latest" \
          --set-env-vars "^@^SERVICE_ROLE=data@CLOUD_SQL_CONNECTION_NAME=${_SQL_INSTANCE}@DB_NAME=datadesk@DB_USER=datadesk@CRAWLER_DB_NAME=mizzou@CRAWLER_DB_USER=datadesk_ro@DJANGO_ALLOWED_HOSTS=${_DATA_HOST},.run.app" \
          --set-cloudsql-instances "${_SQL_INSTANCE}" \
          --ingress all --allow-unauthenticated --min-instances 0

  # gcloud reports a refused IAM binding as a warning and exits zero, so a
  # deploy reports success while every request gets a 403 before reaching
  # Django. The other two front ends check for this; this one was added
  # without the check and did exactly that on its first deploy.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'data-reachable'
    entrypoint: 'bash'
    waitFor: ['data-candidate']
    args:
      - '-c'
      - |
        set -euo pipefail
        policy="$$(gcloud run services get-iam-policy datadesk-data \
                   --region "${_REGION}" --project "$PROJECT_ID" --format=json)"
        if ! echo "$$policy" | grep -q 'run.invoker'; then
          echo "No invoker binding on datadesk-data -- deployed but nobody can reach it."
          echo "Domain Restricted Sharing blocks this unless the project has an exception."
          echo "See infra/README.md, 'Public ingress'."
          exit 1
        fi
        echo "invoker binding present"

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'data-prove'
    entrypoint: 'bash'
    waitFor: ['data-reachable']
    args:
      - '-c'
      - |
        set -euo pipefail
        URL="$$(gcloud run services describe datadesk-data --region "${_REGION}" \
                --project "$PROJECT_ID" --format=json \
                | python3 -c 'import json,sys; print(next((t["url"] for t in json.load(sys.stdin)["status"]["traffic"] if t.get("tag")=="candidate"), ""))')"
        if [ -z "$$URL" ]; then
          URL="$$(gcloud run services describe datadesk-data --region "${_REGION}" \
                  --project "$PROJECT_ID" --format='value(status.url)')"
        fi
        [ -n "$$URL" ] || { echo "no URL to check"; exit 1; }
        code=""
        for _ in $$(seq 1 10); do
          code="$$(curl -s -o /dev/null -w '%{http_code}' "$$URL/_health" || true)"
          [ "$$code" = "200" ] && break
          sleep 3
        done
        echo "candidate $$URL/_health -> $$code"
        [ "$$code" = "200" ] || { echo "data candidate failed its health check"; exit 1; }

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'data-shift'
    entrypoint: 'bash'
    waitFor: ['data-prove']
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run services update-traffic datadesk-data \
          --region "${_REGION}" --project "$PROJECT_ID" --to-latest
        URL="$$(gcloud run services describe datadesk-data --region "${_REGION}" \
                --project "$PROJECT_ID" --format='value(status.url)')"
        code="$$(curl -s -o /dev/null -w '%{http_code}' "$$URL/_health")"
        echo "$$URL/_health -> $$code"
        [ "$$code" = "200" ] || { echo "data smoke test failed"; exit 1; }

# Two migrate jobs and two proved rollouts; the Actions equivalent ran in
# about eleven minutes.
timeout: 3600s

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: 'ALLOW_LOOSE'
