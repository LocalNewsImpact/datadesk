{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Datadesk{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/datadesk.css' %}">
</head>
<body>
  <header class="site-header">
    <span class="wordmark">Datadesk</span>
    {% if user.is_authenticated %}
    <nav class="session">
      <span class="identity">{{ user.email }}</span>
      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit" class="linklike">Sign out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
