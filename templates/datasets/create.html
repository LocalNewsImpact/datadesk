{% extends "base.html" %}
{% block title %}New dataset — Datadesk{% endblock %}

{% block content %}
<section class="card">
  <p class="breadcrumb"><a href="{% url 'datasets:list' %}">← Datasets</a></p>
  <h1>New dataset</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label class="stacked">Slug <input type="text" name="slug" required pattern="[a-z0-9-]+"></label>
    <label class="stacked">Label <input type="text" name="label" required></label>
    <label class="stacked">Name <input type="text" name="name"></label>
    <label class="stacked">Description <textarea name="description" rows="3"></textarea></label>
    <p class="notice">New datasets start with cron off — nothing is
    collected until it is enabled on the dataset page.</p>
    <button type="submit">Create</button>
  </form>
</section>
{% endblock %}
