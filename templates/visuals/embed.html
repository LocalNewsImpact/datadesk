{% load static %}<!doctype html>
<html lang="en"{% if theme_stamp %} data-theme="{{ theme_stamp }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ visual.title }}</title>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/datadesk.css' %}">
  <style>body { background: transparent; } main { padding: 0; }</style>
</head>
<body>
  <main>
    {% include renderer %}
  </main>
    {# Tells the parent how tall it is, so no snippet carries a height. #}
    <script src="{% static 'js/datadesk-embed-height.js' %}"></script>
</body>
</html>
