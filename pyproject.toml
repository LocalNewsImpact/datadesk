# Tool configuration. Line length and toolchain match MizzouNewsCrawler
# (black 88 / isort profile black / ruff / mypy); pytest layout follows
# NewsSourceDirectory.

[project]
name = "datadesk"
version = "0.1.0"
description = "Django console and visuals platform for LNIC research data"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["migrations", "\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
DJANGO_SETTINGS_MODULE = "datadesk.settings"

# What `make test` measures: the application packages, less migrations
# and the tests themselves. How much of it a test must reach is not set
# here -- the floor is lnic_contracts.coverage_floor, the same number in
# every repository, and conforms.yml refuses a fail_under of this
# repository's own.
[tool.coverage.run]
source = ["accounts", "audit", "datadesk", "datasets", "explorer", "review", "visuals"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
